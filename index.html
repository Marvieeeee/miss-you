<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Miss You ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .envelope-container {
            position: relative;
            width: 200px;
            height: 150px;
            cursor: pointer;
        }
        .envelope {
            width: 100%;
            height: 100%;
            background-color: red;
            border-radius: 10px;
            position: absolute;
            transition: transform 0.5s ease-in-out;
        }
        .message {
            width: 100%;
            height: 100%;
            background-color: white;
            border-radius: 10px;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: red;
            font-weight: bold;
            transform: scale(0);
            transition: transform 0.5s ease-in-out;
        }
        .envelope-container.open .envelope {
            transform: translateY(-100px);
        }
        .envelope-container.open .message {
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div class="envelope-container" onclick="openEnvelope()">
        <div class="envelope"></div>
        <div class="message">I miss you ❤️</div>
    </div>

    <script>
        function openEnvelope() {
            document.querySelector('.envelope-container').classList.add('open');
        }
    </script>
</body>
</html>
